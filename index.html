<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Прачечная · Трекер</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#11151a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Прачечная">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg: #11151a;
    --panel: #171c23;
    --panel-2: #1d242c;
    --line: #2a323c;
    --line-soft: #232a32;
    --text: #eef1f4;
    --text-dim: #9aa6b2;
    --text-faint: #5e6b78;
    --steam: #5fb8c9;
    --steam-dim: #2b4a52;
    --amber: #e3a64f;
    --amber-dim: #4a3a22;
    --green: #6fbf78;
    --red: #d9645f;
    --radius: 14px;
    --radius-sm: 9px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  body{ margin:0; background:var(--bg); color:var(--text); min-height:100vh; padding-bottom:84px; }
  .topbar{
    position:sticky; top:0; z-index:20;
    background:rgba(17,21,26,0.92); backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line-soft); padding:16px 18px 14px;
    display:flex; align-items:baseline; justify-content:space-between;
  }
  .topbar .mark{ font-size:11px; letter-spacing:.16em; color:var(--steam); font-weight:700; text-transform:uppercase;}
  .topbar h1{ font-size:19px; margin:2px 0 0; font-weight:700; letter-spacing:-0.01em;}
  .topbar .sub{ font-size:11px; color:var(--text-faint); }
  .view{ padding:16px; max-width:520px; margin:0 auto; }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .stat{ background:var(--panel); border:1px solid var(--line-soft); border-radius:var(--radius); padding:13px 14px; }
  .stat .label{ font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--text-faint); margin-bottom:6px;}
  .stat .val{ font-size:21px; font-weight:700; font-variant-numeric:tabular-nums; }
  .stat .val.steam{ color:var(--steam); }
  .stat .val.amber{ color:var(--amber); }
  .stat .sub2{ font-size:10.5px; color:var(--text-faint); margin-top:4px; }
  .section-title{ font-size:11px; text-transform:uppercase; letter-spacing:.09em; color:var(--text-faint); margin:22px 2px 10px; display:flex; justify-content:space-between; align-items:center; }
  .section-title .more{ color:var(--steam); text-transform:none; letter-spacing:0; font-size:12px; cursor:pointer;}
  .point-card{ background:var(--panel); border:1px solid var(--line-soft); border-radius:var(--radius); padding:13px 14px; margin-bottom:8px; display:flex; align-items:center; gap:12px; cursor:pointer; }
  .point-card:active{ border-color:var(--steam-dim); }
  .point-dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .point-card .pname{ font-size:15px; font-weight:600; flex:1; min-width:0;}
  .point-card .pmeta{ font-size:11.5px; color:var(--text-faint); margin-top:2px;}
  .point-card .pmoney{ text-align:right; }
  .point-card .pmoney .amt{ font-size:15px; font-weight:700; color:var(--amber); font-variant-numeric:tabular-nums;}
  .point-card .pmoney .amt-sub{ font-size:10.5px; color:var(--text-faint); }
  .chev{ color:var(--text-faint); font-size:18px; }
  .btn{ border:1px solid var(--line); background:var(--panel-2); color:var(--text); border-radius:var(--radius-sm); padding:11px 14px; font-size:14px; font-weight:600; cursor:pointer; text-align:center; }
  .btn:active{ transform:scale(0.98); }
  .btn-primary{ background:var(--steam); color:#0b1f23; border-color:var(--steam); }
  .btn-ghost{ background:transparent; color:var(--text-dim); border:1px solid var(--line-soft); font-weight:500;}
  .btn-block{ width:100%; }
  .btn-sm{ padding:7px 11px; font-size:12.5px; }
  label.f{ display:block; margin-bottom:12px; }
  label.f .flabel{ font-size:11.5px; color:var(--text-faint); margin-bottom:5px; display:block; }
  input, select, textarea{ width:100%; background:var(--panel-2); border:1px solid var(--line); color:var(--text); border-radius:var(--radius-sm); padding:10px 12px; font-size:15px; font-family:inherit; }
  input:focus, select:focus, textarea:focus{ outline:none; border-color:var(--steam); }
  .back-row{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .back-btn{ font-size:13px; color:var(--steam); cursor:pointer; font-weight:600; }
  .entry-row{ display:flex; justify-content:space-between; align-items:center; padding:11px 0; border-bottom:1px solid var(--line-soft); font-size:13.5px; gap:8px; }
  .entry-row:last-child{ border-bottom:none; }
  .entry-row .ed{ color:var(--text-dim); width:56px; flex-shrink:0; }
  .entry-row .ek{ color:var(--text); flex:1; min-width:0; }
  .entry-row .eitems{ font-size:11px; color:var(--text-faint); margin-top:2px; }
  .entry-row .ep{ color:var(--amber); font-weight:600; font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap; }
  .entry-row .edel{ color:var(--text-faint); margin-left:4px; cursor:pointer; font-size:16px; }
  .card{ background:var(--panel); border:1px solid var(--line-soft); border-radius:var(--radius); padding:14px; margin-bottom:14px;}
  .tabbar{ position:fixed; bottom:0; left:0; right:0; z-index:30; background:rgba(17,21,26,0.96); backdrop-filter:blur(10px); border-top:1px solid var(--line-soft); display:flex; padding:8px 4px calc(8px + env(safe-area-inset-bottom)); }
  .tab{ flex:1; text-align:center; padding:6px 1px; cursor:pointer; color:var(--text-faint); font-size:9.5px; font-weight:600; letter-spacing:.01em; }
  .tab .ic{ font-size:19px; display:block; margin-bottom:3px; }
  .tab.active{ color:var(--steam); }
  .empty{ text-align:center; padding:36px 10px; color:var(--text-faint); font-size:13.5px; }
  .empty .ic{ font-size:28px; display:block; margin-bottom:10px; opacity:.6;}
  .toast{ position:fixed; bottom:90px; left:50%; transform:translateX(-50%) translateY(8px); background:var(--panel-2); border:1px solid var(--line); color:var(--text); padding:9px 16px; border-radius:20px; font-size:13px; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:50; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .item-grid{ display:grid; grid-template-columns:1fr 64px; gap:8px; align-items:center; margin-bottom:7px;}
  .item-grid .iname{ font-size:13px; color:var(--text-dim); }
  .seg{ display:flex; border:1px solid var(--line); border-radius:var(--radius-sm); overflow:hidden; margin-bottom:12px;}
  .seg div{ flex:1; text-align:center; padding:9px 4px; font-size:12.5px; font-weight:600; color:var(--text-dim); cursor:pointer; }
  .seg div.active{ background:var(--steam-dim); color:var(--steam); }
  .addrow{ display:flex; gap:8px; margin-top:4px; }
  .addrow input{ flex:1; }
  .hint{ font-size:11.5px; color:var(--text-faint); line-height:1.5; margin-bottom:10px;}
</style>
</head>
<body>
<div class="topbar">
  <div>
    <div class="mark">Учёт стирки</div>
    <h1 id="topTitle">Дашборд</h1>
  </div>
  <div style="display:flex;align-items:center;gap:10px;">
    <div class="sub" id="todayDate"></div>
    <div id="lockBtn" style="cursor:pointer;font-size:18px;color:var(--text-faint);display:none;" title="Войти как администратор">🔒</div>
    <div id="unlockBtn" style="cursor:pointer;font-size:13px;color:var(--steam);font-weight:600;display:none;">Выйти</div>
  </div>
</div>

<!-- PIN overlay -->
<div id="pinOverlay" style="display:none;position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;">
  <div style="font-size:28px;margin-bottom:8px;">🔒</div>
  <div style="font-size:18px;font-weight:700;margin-bottom:4px;">Режим просмотра</div>
  <div style="font-size:13px;color:var(--text-faint);margin-bottom:28px;text-align:center;">Для редактирования введи PIN администратора</div>
  <input type="password" id="pinInput" placeholder="PIN-код" inputmode="numeric" style="max-width:200px;text-align:center;font-size:22px;letter-spacing:6px;margin-bottom:12px;">
  <div id="pinError" style="color:var(--red);font-size:13px;min-height:20px;margin-bottom:10px;"></div>
  <button class="btn btn-primary" style="max-width:200px;width:100%;" id="pinEnterBtn">Войти</button>
  <div style="margin-top:16px;">
    <span style="font-size:13px;color:var(--steam);cursor:pointer;" id="pinViewOnlyBtn">Продолжить без входа →</span>
  </div>
</div>
<div class="view" id="view"></div>
<div class="toast" id="toast"></div>
<div class="tabbar">
  <div class="tab active" data-tab="dashboard"><span class="ic">&#9679;</span>Дашборд</div>
  <div class="tab" data-tab="points"><span class="ic">&#9632;</span>Точки</div>
  <div class="tab" data-tab="restirka"><span class="ic">&#9851;</span>Перестирка</div>
  <div class="tab" data-tab="expenses"><span class="ic">&#8372;</span>Расходы</div>
  <div class="tab" data-tab="driver"><span class="ic">&#9658;</span>Водитель</div>
  <div class="tab" data-tab="settings"><span class="ic">&#9881;</span>Настройки</div>
</div>

<script>
const STORAGE_KEY = 'laundry-app-state-v2';
const DOT_COLORS = ['#5fb8c9','#e3a64f','#d9645f','#6fbf78','#8a7fd6','#d68fc0','#7ea6d9','#c9a45f'];

const ITEMS_RESTORAN = ['Ошибори','Салфетка','Микрофибра','Фартук','Сидушка','Чехол на кресло','Униформа','Брюки','Куртка повара','Плед','Скатерть','Толстовка','Футболка','Шторы','Коврик'];
const ITEMS_BRUNO = ['Салфетка белая','Салфетка коричн.','Скатерть белая','Скатерть коричн.','Ошибори','Натирка синяя','Микра черная','Микра красная','Микра синяя','Микра зеленая','Китель повара','Брюки повара','Фартук','Перчатки','Нагрудник','Рубашка','Чехол на резинке','Платье','Брюки клас./джинсы','Штора','Кофта/джемпер','Подушка/сидушка','Плед','Ковер','Пиджак','Мультон'];
const ITEMS_TEREMOK = ['Бережковский халаты','Зубовский комплект','Зубовский туника','Зубовский колпак','Зубовский фартук','Зубовский футболка'];
const ITEMS_PADEL = ['Полотенце'];
const ITEMS_TD = ['Салфетка','Скатерть','Полотенце'];

function mkItems(names, prices={}){ return names.map(n=>({id: n.toLowerCase().replace(/[^a-zа-я0-9]+/gi,'_'), name:n, pricePerUnit: prices[n]||0})); }

// штучные тарифы Моро/Брон/Эмбер/Сарай
const PRICES_RESTORAN = {'Плед':120,'Куртка повара':220,'Брюки повара':175,'Фартук':90,'Декор.нав.':60,'Чехол на кресло':60,'Сидушка':60,'Шторы':200,'Коврик':150,'Толстовка':80,'Футболка':60};

const DEFAULT_STATE = {
  points: [
    {id:'saray',   name:'Сарай 1',      address:'', pricingType:'abonement', tariff:100, abonementFee:85000, capKg:800, items:mkItems(ITEMS_RESTORAN, PRICES_RESTORAN)},
    {id:'moro',    name:'Моро',         address:'', pricingType:'perkg',     tariff:100, abonementFee:0, capKg:0, items:mkItems(ITEMS_RESTORAN, PRICES_RESTORAN)},
    {id:'bron',    name:'Брон',         address:'', pricingType:'perkg',     tariff:100, abonementFee:0, capKg:0, items:mkItems(ITEMS_RESTORAN, PRICES_RESTORAN)},
    {id:'bruno',   name:'Бруно',        address:'', pricingType:'perkg',     tariff:100, abonementFee:0, capKg:0, items:mkItems(ITEMS_BRUNO)},
    {id:'amber',   name:'Эмбер',        address:'', pricingType:'perkg',     tariff:100, abonementFee:0, capKg:0, items:mkItems(ITEMS_RESTORAN, PRICES_RESTORAN)},
    {id:'padel',   name:'Падел',        address:'', pricingType:'perkg',     tariff:80,  abonementFee:0, capKg:0, items:mkItems(ITEMS_PADEL)},
    {id:'teremok', name:'Теремок',      address:'', pricingType:'perkg',     tariff:100, abonementFee:0, capKg:0, items:mkItems(ITEMS_TEREMOK)},
    {id:'td',      name:'Торговый дом', address:'', pricingType:'perkg',     tariff:150, abonementFee:0, capKg:0, items:mkItems(ITEMS_TD)},
  ],
  entries: {},
  restirkaItems: [
    {id:'salfetka', name:'Салфетка', weight:50},
    {id:'oshibori',  name:'Ошибори', weight:50},
    {id:'skatert',   name:'Скатерть', weight:280},
  ],
  restirka: {},
  restirkaTariff: 100,
  expenses: [],
  expenseCategories: ['Порошок цветной','Порошок белый','Белизна','Пакеты','Прочее'],
  driverNotes: [],
  adminPin: '',       // empty = no pin set (open edit), non-empty = pin required
};

let state = null;
let view = {tab:'dashboard', pointId:null};
let isAdmin = false; // session only – reset on reload

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    state = raw ? JSON.parse(raw) : structuredClone(DEFAULT_STATE);
  }catch(e){
    state = structuredClone(DEFAULT_STATE);
  }
  for(const k in DEFAULT_STATE){ if(!(k in state)) state[k] = structuredClone(DEFAULT_STATE[k]); }
  state.points.forEach(p=>{
    if(!p.items) p.items=[];
    if(p.pricingType===undefined) p.pricingType='perkg';
    if(p.abonementFee===undefined) p.abonementFee=0;
    if(p.capKg===undefined) p.capKg=0;
    if(p.address===undefined) p.address='';
    p.items.forEach(it=>{ if(it.pricePerUnit===undefined) it.pricePerUnit=0; });
  });
  // If no PIN set — treat everyone as admin (open mode)
  if(!state.adminPin) isAdmin = true;
  if(!isAdmin) showPinOverlay();
  else render();
}

function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e){ showToast('Не удалось сохранить: ' + e.message); }
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

function fmt(n){ return Math.round((n||0)*100)/100; }
function rub(n){ return Math.round(n||0).toLocaleString('ru-RU') + ' ₽'; }
function todayStr(){ const d=new Date(); return d.toISOString().slice(0,10); }
function monthKey(dateStr){ return dateStr.slice(0,7); }
function thisMonthKey(){ return todayStr().slice(0,7); }
function fmtDate(d){ const [y,m,day]=d.split('-'); return day+'.'+m; }

function showPinOverlay(){
  document.getElementById('pinOverlay').style.display='flex';
  document.getElementById('lockBtn').style.display='none';
  document.getElementById('unlockBtn').style.display='none';
}

function hidePinOverlay(){
  document.getElementById('pinOverlay').style.display='none';
}

function updateLockUI(){
  const lb = document.getElementById('lockBtn');
  const ub = document.getElementById('unlockBtn');
  if(!state.adminPin){ lb.style.display='none'; ub.style.display='none'; return; }
  if(isAdmin){ lb.style.display='none'; ub.style.display='inline'; }
  else { lb.style.display='inline'; ub.style.display='none'; }
  // Hide settings tab for non-admins
  document.querySelectorAll('.tab').forEach(t=>{
    if(t.dataset.tab==='settings'||t.dataset.tab==='expenses'){
      t.style.display = isAdmin ? '' : 'none';
    }
  });
}

document.getElementById('pinEnterBtn').addEventListener('click', ()=>{
  const val = document.getElementById('pinInput').value.trim();
  if(val === state.adminPin){
    isAdmin = true;
    hidePinOverlay();
    updateLockUI();
    render();
  } else {
    document.getElementById('pinError').textContent = 'Неверный PIN';
    document.getElementById('pinInput').value='';
  }
});
document.getElementById('pinInput').addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('pinEnterBtn').click(); });
document.getElementById('pinViewOnlyBtn').addEventListener('click', ()=>{
  hidePinOverlay();
  updateLockUI();
  render();
});
document.getElementById('lockBtn').addEventListener('click', ()=>showPinOverlay());
document.getElementById('unlockBtn').addEventListener('click', ()=>{
  isAdmin = false;
  updateLockUI();
  // Switch to dashboard if on restricted tab
  if(view.tab==='settings'||view.tab==='expenses') view={tab:'dashboard',pointId:null};
  render();
});

document.getElementById('todayDate').textContent = new Date().toLocaleDateString('ru-RU',{day:'numeric',month:'short'});

document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click', ()=>{
    view = {tab:t.dataset.tab, pointId:null};
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    render();
  });
});

function pointEntries(id){ return state.entries[id] || []; }
function pointMonthEntries(id, mk){ return pointEntries(id).filter(e=>monthKey(e.date)===mk); }

function restirkaEntries(id){ return state.restirka[id] || []; }
function restirkaMonthEntries(id, mk){ return restirkaEntries(id).filter(r=>monthKey(r.date)===mk); }

function pointMonthTotals(id, mk){
  const es = pointMonthEntries(id, mk);
  const p = state.points.find(x=>x.id===id);
  const kgMain = fmt(es.reduce((s,e)=>s+(e.kg||0),0));
  const days = es.length;
  const rEntries = restirkaMonthEntries(id, mk);
  const kgRestirka = fmt(rEntries.reduce((s,r)=>s+(r.kg||0),0));
  const rubRestirka = fmt(rEntries.reduce((s,r)=>s+(r.rub||0),0));
  let rubMain = 0, subLabel = '';
  if(p.pricingType === 'abonement'){
    const overKg = Math.max(0, kgMain - p.capKg);
    rubMain = p.abonementFee + overKg*p.tariff;
    subLabel = overKg>0 ? `+${fmt(overKg)} кг сверх` : `до ${p.capKg} кг`;
  } else {
    rubMain = fmt(kgMain*p.tariff);
    subLabel = p.tariff+'₽/кг';
  }
  const kgTotal = fmt(kgMain + kgRestirka);
  const rubTotal = fmt(rubMain + rubRestirka);
  return {kg:kgTotal, kgMain, kgRestirka, rub:rubTotal, rubMain, rubRestirka, days, subLabel};
}

function getPointDayBlocks(pid){
  const blocks = {};
  pointEntries(pid).forEach(e=>{
    if(!blocks[e.date]) blocks[e.date] = {date:e.date, mains:[], rests:[]};
    blocks[e.date].mains.push(e);
  });
  restirkaEntries(pid).forEach(r=>{
    if(!blocks[r.date]) blocks[r.date] = {date:r.date, mains:[], rests:[]};
    blocks[r.date].rests.push(r);
  });
  return Object.values(blocks).sort((a,b)=>a.date.localeCompare(b.date));
}

const MONTH_NAMES_RU = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const DAY_NAMES_RU = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
function getDayOfWeek(dateStr){ return DAY_NAMES_RU[new Date(dateStr).getDay()]; }
function daysInMonth(yr, mo){ return new Date(yr, mo, 0).getDate(); }

function buildYearlyWorkbook(p, year){
  if(typeof XLSX === 'undefined'){ showToast('Нет соединения для экспорта'); return null; }
  const wb = XLSX.utils.book_new();
  const yr = year || new Date().getFullYear();
  const monthTotalsForSummary = [];

  for(let mo=1; mo<=12; mo++){
    const mk = `${yr}-${String(mo).padStart(2,'0')}`;
    const moName = MONTH_NAMES_RU[mo-1];
    const numDays = daysInMonth(yr, mo);

    const mEntries = pointEntries(p.id).filter(e=>monthKey(e.date)===mk);
    const mRest    = restirkaEntries(p.id).filter(r=>monthKey(r.date)===mk);

    // index by day
    const byDay = {};
    for(let d=1;d<=numDays;d++) byDay[d]={kg:0, items:{}, restKg:0, restRub:0, note:'', hasData:false};
    mEntries.forEach(e=>{
      const d=parseInt(e.date.split('-')[2]);
      byDay[d].kg += e.kg||0;
      byDay[d].hasData = true;
      if(e.note) byDay[d].note = byDay[d].note ? byDay[d].note+'; '+e.note : e.note;
      Object.entries(e.items||{}).forEach(([iid,n])=>{ byDay[d].items[iid]=(byDay[d].items[iid]||0)+n; });
    });
    mRest.forEach(r=>{
      const d=parseInt(r.date.split('-')[2]);
      byDay[d].restKg += r.kg||0; byDay[d].restRub += r.rub||0; byDay[d].hasData=true;
    });

    // calc totals
    let totalKg=0, totalEd=0, totalShtuch=0, totalDays=0, totalRestKg=0, totalRestRub=0;
    const itemTotals={};
    p.items.forEach(it=>itemTotals[it.id]=0);
    for(let d=1;d<=numDays;d++){
      const row=byDay[d];
      if(row.kg>0||Object.keys(row.items).length>0) totalDays++;
      totalKg+=row.kg; totalRestKg+=row.restKg; totalRestRub+=row.restRub;
      let dayShtuch=0;
      p.items.forEach(it=>{ const n=row.items[it.id]||0; itemTotals[it.id]+=n; totalEd+=n; if(it.pricePerUnit>0) dayShtuch+=n*it.pricePerUnit; });
      totalShtuch+=dayShtuch;
      row._shtuch=dayShtuch;
    }
    let totalMainRub=0;
    if(p.pricingType==='abonement'){
      const over=Math.max(0,totalKg-p.capKg);
      totalMainRub=p.abonementFee+over*p.tariff;
    } else { totalMainRub=Math.round(totalKg*p.tariff); }
    const totalRub=totalMainRub+totalShtuch+totalRestRub;

    monthTotalsForSummary.push({mo, moName, totalDays, totalKg:fmt(totalKg), totalRestKg:fmt(totalRestKg), totalEd, totalMainRub, totalShtuch, totalRestRub, totalRub});

    // ── build rows ──
    const rows=[];
    rows.push([null, `${p.name.toUpperCase()} · ${moName.toUpperCase()} ${yr}`]);
    rows.push([null, `${p.name} · Учёт стирки за ${moName.toLowerCase()} ${yr}`]);
    rows.push([]);
    // summary bar
    rows.push([null,'ВЕС, КГ',null,null,null,null,'ЕДИНИЦ',null,null,null,null,'ДНЕЙ СТИРКИ',null,null,null,null,'К ОПЛАТЕ, ₽']);
    rows.push([null,fmt(totalKg+totalRestKg),null,null,null,null,totalEd,null,null,null,null,totalDays,null,null,null,null,totalRub]);
    rows.push([]);
    // pricing info
    if(p.pricingType==='abonement'){
      rows.push([null,`Абонемент ${p.abonementFee.toLocaleString('ru-RU')} ₽/мес (до ${p.capKg} кг). Сверх: ${p.tariff} ₽/кг`]);
    } else {
      rows.push([null,`Тариф: ${p.tariff} ₽/кг`]);
    }
    rows.push([]);
    // column headers
    const itemNames=p.items.map(it=>it.name);
    rows.push([null,'День','ДН','Вес, кг','Всего ед.',...itemNames,'Перест.,кг','Заметки','Стирка,₽','Штучные,₽','Надбавки,₽','Доставка,₽','К оплате,₽']);
    // day rows
    for(let d=1;d<=numDays;d++){
      const row=byDay[d];
      const dateStr=`${yr}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const dn=getDayOfWeek(dateStr);
      const ed=p.items.reduce((s,it)=>s+(row.items[it.id]||0),0);
      const itemCols=p.items.map(it=>row.items[it.id]||null);
      const dayMainRub=p.pricingType==='perkg'&&row.kg>0 ? Math.round(row.kg*p.tariff) : null;
      const kToPlate=(dayMainRub||0)+(row._shtuch||0)+row.restRub || null;
      rows.push([null,d,dn,row.kg||null,ed||null,...itemCols,
        row.restKg||null, row.note||null,
        dayMainRub, row._shtuch||null, null, null, kToPlate]);
    }
    // итого
    const itemTotalCols=p.items.map(it=>itemTotals[it.id]||null);
    rows.push([null,'ИТОГО',null,
      totalKg?fmt(totalKg):null, totalEd||null, ...itemTotalCols,
      totalRestKg?fmt(totalRestKg):null, null,
      totalMainRub||null, totalShtuch||null, null, null, totalRub||null]);

    if(mRest.length){
      rows.push([]);
      rows.push([null,`ПЕРЕСТИРКА (${state.restirkaTariff} ₽/кг)`]);
      rows.push([null,'Дата','кг',...state.restirkaItems.map(it=>it.name+' шт'),'Сумма,₽']);
      mRest.sort((a,b)=>a.date.localeCompare(b.date)).forEach(r=>{
        rows.push([null,r.date,r.kg,...state.restirkaItems.map(it=>(r.qty&&r.qty[it.id])||null),r.rub]);
      });
      rows.push([null,'Итого перестирка',fmt(totalRestKg),...state.restirkaItems.map(()=>null),Math.round(totalRestRub)]);
    }

    const ws=XLSX.utils.aoa_to_sheet(rows);
    ws['!cols']=[{wch:2},{wch:6},{wch:4},{wch:8},{wch:8},...p.items.map(()=>({wch:9})),{wch:10},{wch:22},{wch:10},{wch:10},{wch:10},{wch:10},{wch:12}];
    const sheetName=`${String(mo).padStart(2,'0')}.${moName.slice(0,3)}`;
    XLSX.utils.book_append_sheet(wb, ws, sheetName);
  }

  // ── Summary sheet (like 🎯 Дашборд) ──
  const sumRows=[];
  sumRows.push([null,`${p.name} · ГОДОВОЙ ОТЧЁТ ${yr}`]);
  sumRows.push([]);
  sumRows.push([null,p.pricingType==='abonement'?`Абонемент ${p.abonementFee.toLocaleString('ru-RU')} ₽/мес (до ${p.capKg} кг)`:`Тариф: ${p.tariff} ₽/кг`]);
  sumRows.push([]);
  sumRows.push([null,'Месяц','Дней','Кг стирка','Кг перест.','Итого кг','Ед.',`Стирка,₽`,'Штучные,₽','Перест.,₽','К оплате,₽']);
  let gKg=0,gRub=0,gDays=0;
  monthTotalsForSummary.forEach(t=>{
    const totKg=fmt((parseFloat(t.totalKg)||0)+(parseFloat(t.totalRestKg)||0));
    sumRows.push([null,t.moName,t.totalDays||null,t.totalKg||null,t.totalRestKg||null,totKg||null,t.totalEd||null,t.totalMainRub||null,t.totalShtuch||null,t.totalRestRub||null,t.totalRub||null]);
    gKg+=parseFloat(totKg)||0; gRub+=t.totalRub||0; gDays+=t.totalDays||0;
  });
  sumRows.push([null,'ИТОГО ЗА ГОД',gDays,null,null,fmt(gKg),null,null,null,null,Math.round(gRub)]);
  const wsSumm=XLSX.utils.aoa_to_sheet(sumRows);
  wsSumm['!cols']=[{wch:2},{wch:14},{wch:6},{wch:12},{wch:12},{wch:10},{wch:6},{wch:12},{wch:12},{wch:12},{wch:14}];
  XLSX.utils.book_append_sheet(wb, wsSumm, '📊 Годовая сводка');

  return wb;
}

function exportPointExcel(pid){
  const p=state.points.find(x=>x.id===pid);
  const yr=new Date().getFullYear();
  showToast('Формирую годовой Excel...');
  setTimeout(()=>{
    const wb=buildYearlyWorkbook(p, yr);
    if(!wb) return;
    XLSX.writeFile(wb, `${p.name.replace(/\s+/g,'_')}_${yr}.xlsx`);
    showToast('Готово!');
  },50);
}

function exportAllExcel(){
  if(typeof XLSX==='undefined'){ showToast('Нет соединения для экспорта'); return; }
  const yr=new Date().getFullYear();
  showToast('Формирую сводный файл...');
  setTimeout(()=>{
    const wb=XLSX.utils.book_new();
    // Summary across all points
    const mk=thisMonthKey();
    const sumRows=[];
    sumRows.push([null,`СВОДКА ПО ВСЕМ ТОЧКАМ · ${yr}`]);
    sumRows.push([]);
    sumRows.push([null,'Точка','Адрес','Кг (стирка)','Кг (перест.)','Итого кг','К оплате,₽']);
    let gKg=0,gRub=0;
    state.points.forEach(p=>{
      const t=pointMonthTotals(p.id,mk);
      sumRows.push([null,p.name,p.address||'',t.kgMain,t.kgRestirka,t.kg,Math.round(t.rub)]);
      gKg+=parseFloat(t.kg)||0; gRub+=parseFloat(t.rub)||0;
    });
    sumRows.push([null,'ИТОГО','','','',fmt(gKg),Math.round(gRub)]);
    const wsS=XLSX.utils.aoa_to_sheet(sumRows);
    wsS['!cols']=[{wch:2},{wch:16},{wch:22},{wch:12},{wch:12},{wch:10},{wch:14}];
    XLSX.utils.book_append_sheet(wb,wsS,'Сводка');
    // Per-point yearly tabs
    state.points.forEach(p=>{
      const ptWb=buildYearlyWorkbook(p,yr);
      if(!ptWb) return;
      ptWb.SheetNames.forEach(sn=>{
        const label=(p.name.slice(0,8)+' '+sn).slice(0,31);
        XLSX.utils.book_append_sheet(wb,ptWb.Sheets[sn],label);
      });
    });
    XLSX.writeFile(wb,`Прачечная_${yr}.xlsx`);
    showToast('Готово!');
  },50);
}

function render(){
  const titles = {dashboard:'Дашборд', points:'Точки', restirka:'Перестирка', expenses:'Расходы', driver:'Водитель', settings:'Настройки'};
  document.getElementById('topTitle').textContent = view.pointId ? (state.points.find(p=>p.id===view.pointId)?.name||'') : view.settingPointId ? 'Настройка точки' : titles[view.tab];
  updateLockUI();
  const el = document.getElementById('view');
  el.innerHTML = '';
  if(view.tab==='dashboard') renderDashboard(el);
  else if(view.tab==='points') view.pointId ? renderPointDetail(el) : renderPoints(el);
  else if(view.tab==='restirka') renderRestirka(el);
  else if(view.tab==='expenses') renderExpenses(el);
  else if(view.tab==='driver') renderDriver(el);
  else if(view.tab==='settings') view.settingPointId ? renderSettingsPoint(el) : renderSettings(el);
}

function renderDashboard(el){
  const mk = thisMonthKey();
  let totalKg=0, totalRub=0, totalDays=0;
  state.points.forEach(p=>{ const t = pointMonthTotals(p.id, mk); totalKg += t.kg; totalRub += t.rub; totalDays += t.days; });
  const expMonth = state.expenses.filter(e=>monthKey(e.date)===mk).reduce((s,e)=>s+(e.amount||0),0);
  const restMonth = Object.values(state.restirka).flat().filter(r=>monthKey(r.date)===mk).reduce((s,r)=>s+(r.rub||0),0);

  el.innerHTML = `
    <div class="grid2">
      <div class="stat"><div class="label">Кг за месяц</div><div class="val steam">${fmt(totalKg)}</div></div>
      <div class="stat"><div class="label">К оплате</div><div class="val amber">${rub(totalRub)}</div></div>
      <div class="stat"><div class="label">Выездов</div><div class="val">${totalDays}</div></div>
      <div class="stat"><div class="label">Расходы прачечной</div><div class="val">${rub(expMonth)}</div></div>
    </div>
    <div class="section-title"><span>Точки · этот месяц</span><span class="more" data-go="points">все →</span></div>
    <div id="dashPoints"></div>
    ${restMonth ? `<div class="section-title">Перестирка</div><div class="stat"><div class="label">За месяц</div><div class="val amber">${rub(restMonth)}</div></div>` : ''}
  `;
  const dp = el.querySelector('#dashPoints');
  state.points.forEach((p,i)=>dp.appendChild(pointCardEl(p, pointMonthTotals(p.id, mk), i)));
  el.querySelector('[data-go="points"]').addEventListener('click', ()=>{
    view={tab:'points', pointId:null};
    document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active', x.dataset.tab==='points'));
    render();
  });
}

function pointCardEl(p, t, i){
  const div = document.createElement('div');
  div.className = 'point-card';
  const metaStr = t.kgRestirka>0
    ? `${t.kgMain} + ${t.kgRestirka} (перест.) кг · ${t.days} ${t.days===1?'выезд':'выездов'}`
    : `${t.kg} кг · ${t.days} ${t.days===1?'выезд':'выездов'}`;
  div.innerHTML = `
    <div class="point-dot" style="background:${DOT_COLORS[i%DOT_COLORS.length]}"></div>
    <div style="flex:1; min-width:0;">
      <div class="pname">${p.name}</div>
      <div class="pmeta">${metaStr}</div>
    </div>
    <div class="pmoney"><div class="amt">${rub(t.rub)}</div><div class="amt-sub">${t.subLabel}</div></div>
    <div class="chev">›</div>
  `;
  div.addEventListener('click', ()=>{
    view = {tab:'points', pointId:p.id};
    document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active', x.dataset.tab==='points'));
    render();
  });
  return div;
}

function renderPoints(el){
  const mk = thisMonthKey();
  const topRow = document.createElement('div');
  topRow.style.cssText = 'display:flex; justify-content:flex-end; margin-bottom:10px;';
  topRow.innerHTML = `<button class="btn btn-sm" id="exportAllBtn">⬇ Excel · все точки</button>`;
  el.appendChild(topRow);
  topRow.querySelector('#exportAllBtn').addEventListener('click', exportAllExcel);
  const wrap = document.createElement('div');
  state.points.forEach((p,i)=>wrap.appendChild(pointCardEl(p, pointMonthTotals(p.id, mk), i)));
  el.appendChild(wrap);
}

function renderPointDetail(el){
  const p = state.points.find(x=>x.id===view.pointId);
  const entries = pointEntries(p.id).slice().sort((a,b)=>b.date.localeCompare(a.date));
  const mk = thisMonthKey();
  const t = pointMonthTotals(p.id, mk);

  el.innerHTML = `
    <div class="back-row"><span class="back-btn" id="backBtn">‹ Точки</span><span style="flex:1;"></span><button class="btn btn-sm" id="exportBtn">⬇ Excel</button></div>
    <div class="grid2">
      <div class="stat"><div class="label">Кг за месяц</div><div class="val steam">${t.kg}</div>
        ${t.kgRestirka>0 ? `<div class="sub2">${t.kgMain} стирка + ${t.kgRestirka} перест.</div>` : ''}
      </div>
      <div class="stat"><div class="label">К оплате</div><div class="val amber">${rub(t.rub)}</div>
        ${t.kgRestirka>0 ? `<div class="sub2">${rub(t.rubMain)} + ${rub(t.rubRestirka)} перест.</div>` : `<div class="sub2">${t.subLabel}</div>`}
      </div>
    </div>

    <div class="card" style="margin-top:14px;">
      <div class="seg">
        <div data-pt="perkg" class="${p.pricingType==='perkg'?'active':''}">За кг</div>
        <div data-pt="abonement" class="${p.pricingType==='abonement'?'active':''}">Абонемент</div>
      </div>
      <div id="pricingFields"></div>
    </div>

    ${isAdmin ? `
    <div class="card">
      <label class="f"><span class="flabel">Дата</span><input type="date" id="dateInput" value="${todayStr()}"></label>
      <label class="f"><span class="flabel">Вес, кг (по весам)</span><input type="number" id="kgInput" placeholder="0" step="0.1"></label>
      <div class="section-title" style="margin:14px 0 6px;">Позиции, шт</div>
      <div id="itemFields"></div>
      <div class="addrow">
        <input type="text" id="newItemName" placeholder="добавить позицию...">
        <button class="btn btn-sm" id="addItemBtn">+</button>
      </div>
      <label class="f" style="margin-top:12px;"><span class="flabel">Заметка</span><input type="text" id="noteInput" placeholder="срочно, доставка и т.д."></label>
      <button class="btn btn-primary btn-block" id="addEntryBtn">Добавить запись</button>
    </div>
    ` : `<div class="card" style="padding:14px;"><div class="hint" style="margin:0;">👁 Режим просмотра — добавление записей недоступно</div></div>`}

    <div class="section-title">История</div>
    <div class="card" id="historyCard" style="padding:6px 14px;"></div>
  `;

  el.querySelector('#backBtn').addEventListener('click', ()=>{ view.pointId=null; render(); });
  el.querySelector('#exportBtn').addEventListener('click', ()=>exportPointExcel(p.id));

  function renderPricingFields(){
    const pf = el.querySelector('#pricingFields');
    if(!isAdmin){ pf.innerHTML=`<div class="hint" style="margin:0;">${p.pricingType==='abonement'?`Абонемент ${p.abonementFee.toLocaleString('ru-RU')} ₽/мес (до ${p.capKg} кг)`:`Тариф: ${p.tariff} ₽/кг`}</div>`; return; }
    if(p.pricingType==='abonement'){
      pf.innerHTML = `
        <label class="f"><span class="flabel">Абонемент, ₽/мес</span><input type="number" id="abonementFee" value="${p.abonementFee}" step="1000"></label>
        <label class="f"><span class="flabel">Включено кг/мес</span><input type="number" id="capKg" value="${p.capKg}" step="10"></label>
        <label class="f"><span class="flabel">Доплата за кг сверх лимита, ₽</span><input type="number" id="tariffInput" value="${p.tariff}" step="1"></label>
      `;
      pf.querySelector('#abonementFee').addEventListener('change', e=>{ p.abonementFee=parseFloat(e.target.value)||0; saveState(); render(); });
      pf.querySelector('#capKg').addEventListener('change', e=>{ p.capKg=parseFloat(e.target.value)||0; saveState(); render(); });
      pf.querySelector('#tariffInput').addEventListener('change', e=>{ p.tariff=parseFloat(e.target.value)||0; saveState(); render(); });
    } else {
      pf.innerHTML = `<label class="f"><span class="flabel">Тариф, ₽/кг</span><input type="number" id="tariffInput" value="${p.tariff}" step="1"></label>`;
      pf.querySelector('#tariffInput').addEventListener('change', e=>{ p.tariff=parseFloat(e.target.value)||0; saveState(); render(); });
    }
  }
  renderPricingFields();
  el.querySelectorAll('.seg div').forEach(d=>{
    d.addEventListener('click', ()=>{ p.pricingType = d.dataset.pt; saveState(); render(); });
  });

  if(el.querySelector('#itemFields')){
    const ifld = el.querySelector('#itemFields');
    function renderItemFields(){
      ifld.innerHTML='';
      p.items.forEach(it=>{
        const row = document.createElement('div');
        row.className = 'item-grid';
        row.style.gridTemplateColumns = '1fr 64px';
        const priceHint = it.pricePerUnit>0 ? ` <span style="color:var(--amber);font-size:11px;">${it.pricePerUnit}₽/шт</span>` : '';
        row.innerHTML = `<span class="iname">${it.name}${priceHint}</span><input type="number" data-item="${it.id}" placeholder="0" min="0">`;
        ifld.appendChild(row);
      });
    }
    renderItemFields();

    el.querySelector('#addItemBtn').addEventListener('click', ()=>{
      const inp = el.querySelector('#newItemName');
      const name = inp.value.trim();
      if(!name) return;
      const id = name.toLowerCase().replace(/[^a-zа-я0-9]+/gi,'_')+'_'+Date.now();
      p.items.push({id, name, pricePerUnit:0});
      inp.value='';
      saveState(); renderItemFields();
    });

    el.querySelector('#addEntryBtn').addEventListener('click', ()=>{
      const date = el.querySelector('#dateInput').value || todayStr();
      const kg = parseFloat(el.querySelector('#kgInput').value);
      const note = el.querySelector('#noteInput').value.trim();
      const items = {};
      el.querySelectorAll('[data-item]').forEach(inp=>{
        const n = parseInt(inp.value)||0;
        if(n>0) items[inp.dataset.item]=n;
      });
      if(!kg && !Object.keys(items).length){ showToast('Укажи вес или позиции'); return; }
      if(!state.entries[p.id]) state.entries[p.id]=[];
      state.entries[p.id].push({date, kg: kg||0, items, note});
      saveState(); showToast('Запись добавлена'); render();
    });
  }

  const hc = el.querySelector('#historyCard');
  const blocks = {};
  pointEntries(p.id).forEach(e=>{
    if(!blocks[e.date]) blocks[e.date] = {date:e.date, mains:[], rests:[]};
    blocks[e.date].mains.push(e);
  });
  restirkaEntries(p.id).forEach(r=>{
    if(!blocks[r.date]) blocks[r.date] = {date:r.date, mains:[], rests:[]};
    blocks[r.date].rests.push(r);

        if(dayRub!==null) mainRub += dayRub;
        const itemsStr = e.items && Object.keys(e.items).length
          ? Object.entries(e.items).map(([iid,n])=>{ const it=p.items.find(x=>x.id===iid); return (it?it.name:iid)+' '+n; }).join(', ')
          : '';
        const realIdx = state.entries[p.id].indexOf(e);
        const row = document.createElement('div');
        row.className = 'entry-row';
        row.style.borderBottom = 'none';
        row.innerHTML = `
          <span class="ed">${fmtDate(e.date)}</span>
          <span class="ek">Стирка${e.kg?': '+e.kg+' кг':''}${e.note?' · '+e.note:''}${itemsStr?`<div class="eitems">${itemsStr}</div>`:''}</span>
          <span class="ep">${dayRub!==null ? rub(dayRub) : '—'}</span>
          ${isAdmin?`<span class="edel" data-mainidx="${realIdx}">✕</span>`:''}
        `;
        if(isAdmin) row.querySelector('.edel').addEventListener('click', ()=>{ state.entries[p.id].splice(realIdx,1); saveState(); render(); });
        wrap.appendChild(row);
      });

      let restKg = 0, restRub = 0;
      block.rests.forEach(r=>{
        restKg += r.kg||0; restRub += r.rub||0;
        const realIdx = state.restirka[p.id].indexOf(r);
        const itemsStr = Object.entries(r.qty||{}).map(([iid,n])=>{
          const it = state.restirkaItems.find(x=>x.id===iid); return (it?it.name:iid)+' '+n;
        }).join(', ');
        const row = document.createElement('div');
        row.className = 'entry-row';
        row.style.borderBottom = 'none';
        row.innerHTML = `
          <span class="ed"></span>
          <span class="ek" style="color:var(--steam)">Перестирка: ${r.kg} кг${itemsStr?`<div class="eitems">${itemsStr}</div>`:''}</span>
          <span class="ep">${rub(r.rub)}</span>
          ${isAdmin?`<span class="edel" data-restidx="${realIdx}">✕</span>`:''}
        `;
        if(isAdmin) row.querySelector('.edel').addEventListener('click', ()=>{ state.restirka[p.id].splice(realIdx,1); saveState(); render(); });
        wrap.appendChild(row);
      });

      if(block.mains.length && block.rests.length){
        const totalRow = document.createElement('div');
        totalRow.className = 'entry-row';
        totalRow.style.borderBottom = 'none';
        totalRow.innerHTML = `<span class="ed"></span><span class="ek" style="font-weight:600;">Итого за день: ${fmt(mainKg+restKg)} кг</span><span class="ep" style="font-weight:700;">${rub(mainRub+restRub)}</span><span></span>`;
        wrap.appendChild(totalRow);
      }
      hc.appendChild(wrap);
    });
  }
}

function renderRestirka(el){
  const mk = thisMonthKey();
  const allMonth = Object.entries(state.restirka).flatMap(([pid,arr])=>arr.filter(r=>monthKey(r.date)===mk).map(r=>({...r,pid})));
  const totalKg = fmt(allMonth.reduce((s,r)=>s+r.kg,0));
  const totalRub = allMonth.reduce((s,r)=>s+r.rub,0);

  el.innerHTML = `
    <div class="grid2">

const MONTH_NAMES_RU = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const DAY_NAMES = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];

function getDayName(dateStr){
  return DAY_NAMES[new Date(dateStr).getDay()];
}

function buildPointSheetData(p){
  const allEntries = pointEntries(p.id);
  const allRestirka = restirkaEntries(p.id);
  const allDates = [...new Set([...allEntries.map(e=>e.date), ...allRestirka.map(r=>r.date)])].sort();
  if(!allDates.length) return null;

  const months = [...new Set(allDates.map(d=>monthKey(d)))].sort();
  const wb = XLSX.utils.book_new();

  months.forEach(mk=>{
    const [yr, mo] = mk.split('-');
    const moInt = parseInt(mo);
    const moName = MONTH_NAMES_RU[moInt-1];
    const daysInMonth = new Date(parseInt(yr), moInt, 0).getDate();

    const mEntries = allEntries.filter(e=>monthKey(e.date)===mk);
    const mRest = allRestirka.filter(r=>monthKey(r.date)===mk);

    // Build lookup by day
    const byDay = {};
    for(let d=1;d<=daysInMonth;d++) byDay[d]={kg:0, items:{}, restKg:0, restRub:0, note:'', rubMain:0, rubShtuch:0};
    mEntries.forEach(e=>{
      const day = parseInt(e.date.split('-')[2]);
      byDay[day].kg += e.kg||0;
      byDay[day].note = e.note||'';
      if(e.items) Object.entries(e.items).forEach(([iid,n])=>{ byDay[day].items[iid]=(byDay[day].items[iid]||0)+n; });
    });
    mRest.forEach(r=>{
      const day = parseInt(r.date.split('-')[2]);
      byDay[day].restKg += r.kg||0;
      byDay[day].restRub += r.rub||0;
    });

    // Calculate money per day
    let totalKg=0, totalShtuch=0, totalNadb=0, totalRub=0, totalDays=0, totalEd=0;
    let totalRestKg=0, totalRestRub=0;
    for(let d=1;d<=daysInMonth;d++){
      const row = byDay[d];
      if(row.kg>0 || Object.keys(row.items).length) totalDays++;
      totalKg += row.kg;
      totalRestKg += row.restKg;
      totalRestRub += row.restRub;
      // штучные
      let dayEd=0, dayShtuch=0;
      p.items.forEach(it=>{
        const qty = row.items[it.id]||0;
        dayEd += qty;
        if(it.pricePerUnit>0) dayShtuch += qty*it.pricePerUnit;
      });
      totalEd += dayEd;
      totalShtuch += dayShtuch;
      row.rubShtuch = dayShtuch;
      // стирка
      const dayRubMain = p.pricingType==='perkg' ? row.kg*p.tariff : 0;
      row.rubMain = dayRubMain;
      totalRub += dayRubMain + dayShtuch;
    }
    if(p.pricingType==='abonement'){
      const overKg = Math.max(0, totalKg - p.capKg);
      totalRub = p.abonementFee + overKg*p.tariff + totalShtuch;
    }

    // Build sheet rows like original
    const rows = [];
    // Row 1: title
    rows.push([null, `${p.name.toUpperCase()} · ${moName.toUpperCase()} ${yr}`]);
    // Row 2: subtitle
    rows.push([null, `${p.name} · Учёт стирки за ${moName.toLowerCase()} ${yr}`]);
    rows.push([]);
    // Row 4: summary headers
    rows.push([null, 'ВЕС, КГ', null, null, null, null, 'ЕДИНИЦ', null, null, null, null, 'ДНЕЙ СТИРКИ', null, null, null, null, 'К ОПЛАТЕ, ₽']);
    // Row 5: summary values
    rows.push([null, fmt(totalKg+totalRestKg), null, null, null, null, totalEd, null, null, null, null, totalDays, null, null, null, null, Math.round(totalRub+totalRestRub)]);
    rows.push([]);
    // Row 7: column headers
    const itemNames = p.items.map(it=>it.name);
    rows.push([null,'День','ДН','Вес, кг','Всего ед.',...itemNames,'Перест.,кг','Заметки','Стирка,₽','Штучные,₽','Надбавки,₽','Доставка,₽','К оплате,₽']);

    // Day rows
    const itemTotals = {};
    p.items.forEach(it=>itemTotals[it.id]=0);
    for(let d=1;d<=daysInMonth;d++){
      const row = byDay[d];
      const dateStr = `${yr}-${mo}-${String(d).padStart(2,'0')}`;
      const dn = getDayName(dateStr);
      const ed = p.items.reduce((s,it)=>s+(row.items[it.id]||0),0);
      const itemCols = p.items.map(it=>{ const n=row.items[it.id]||0; itemTotals[it.id]+=n; return n||null; });
      const kToPlate = row.rubMain + row.rubShtuch + row.restRub;
      rows.push([null, d, dn, row.kg||null, ed||null, ...itemCols,
        row.restKg||null, row.note||null,
        row.rubMain||null, row.rubShtuch||null, null, null,
        kToPlate||null]);
    }

    // ИТОГО row
    const itemTotalCols = p.items.map(it=>itemTotals[it.id]||null);
    rows.push([null,'ИТОГО',null,fmt(totalKg),totalEd||null,...itemTotalCols,
      fmt(totalRestKg)||null, null,
      p.pricingType==='perkg'?Math.round(totalKg*p.tariff):p.abonementFee,
      Math.round(totalShtuch)||null, null, null,
      Math.round(totalRub+totalRestRub)]);

    // if abonement – explain
    if(p.pricingType==='abonement'){
      rows.push([]);
      rows.push([null, `Абонемент: ${p.abonementFee.toLocaleString('ru-RU')} ₽/мес (до ${p.capKg} кг). Сверх лимита: ${p.tariff} ₽/кг.`]);
    }

    // Перестирка block if any
    if(mRest.length){
      rows.push([]);
      rows.push([null, `ПЕРЕСТИРКА (тариф ${state.restirkaTariff} ₽/кг)`]);
      const rHdr = state.restirkaItems.map(it=>it.name+' шт');
      rows.push([null,'Дата','кг',...rHdr,'Сумма, ₽']);
      let rTotalKg=0, rTotalRub=0;
      mRest.sort((a,b)=>a.date.localeCompare(b.date)).forEach(r=>{
        const qCols = state.restirkaItems.map(it=>(r.qty&&r.qty[it.id])||null);
        rows.push([null, r.date, r.kg, ...qCols, r.rub]);
        rTotalKg+=r.kg; rTotalRub+=r.rub;
      });
      rows.push([null,'ИТОГО',fmt(rTotalKg),...state.restirkaItems.map(()=>null),Math.round(rTotalRub)]);
    }

    const ws = XLSX.utils.aoa_to_sheet(rows);
    // Column widths
    ws['!cols'] = [
      {wch:2},{wch:6},{wch:4},{wch:8},{wch:8},
      ...p.items.map(()=>({wch:10})),
      {wch:10},{wch:20},{wch:10},{wch:10},{wch:10},{wch:10},{wch:12}
    ];
    const sheetName = `${String(moInt).padStart(2,'0')}.${moName.slice(0,3)}`;
    XLSX.utils.book_append_sheet(wb, ws, sheetName);
  });

  // Summary sheet
  const summaryRows = [];
  summaryRows.push([null, `${p.name} · ГОДОВОЙ ОТЧЁТ`]);
  summaryRows.push([]);
  summaryRows.push([null,'Месяц','Дней','Кг (стирка)','Кг (перест.)','Итого кг','Штучных, ₽','К оплате, ₽']);
  let gKg=0, gRub=0;
  months.forEach(mk=>{
    const [yr,mo]=mk.split('-');
    const t = pointMonthTotals(p.id, mk);
    const moName = MONTH_NAMES_RU[parseInt(mo)-1];
    summaryRows.push([null, moName+' '+yr, t.days, t.kgMain, t.kgRestirka, t.kg, null, Math.round(t.rub)]);
    gKg+=t.kg; gRub+=t.rub;
  });
  summaryRows.push([null,'ИТОГО',null,null,null,fmt(gKg),null,Math.round(gRub)]);
  const wsSummary = XLSX.utils.aoa_to_sheet(summaryRows);
  wsSummary['!cols']=[{wch:2},{wch:16},{wch:6},{wch:12},{wch:12},{wch:10},{wch:12},{wch:14}];
  XLSX.utils.book_append_sheet(wb, wsSummary, 'Сводка');

  // Дашборд sheet — first, like original
  const dashRows = [];
  dashRows.push([null, `${p.name.toUpperCase()} · ГОДОВОЙ УЧЁТ ${new Date().getFullYear()}`]);
  dashRows.push([]);
  dashRows.push([null,'Месяц','Дней','Кг (стирка)','Кг (перест.)','Итого кг','Стирка, ₽','Перест., ₽','Итого, ₽','На выезд, ₽']);
  let gKg=0, gRub=0, gDays=0;
  months.forEach(mk=>{
    const [yr2,mo2]=mk.split('-');
    const t = pointMonthTotals(p.id, mk);
    const moName2 = MONTH_NAMES_RU[parseInt(mo2)-1];
    const perDay = t.days>0 ? Math.round(t.rub/t.days) : 0;
    dashRows.push([null,moName2+' '+yr2, t.days, t.kgMain, t.kgRestirka, t.kg, Math.round(t.rubMain), Math.round(t.rubRestirka), Math.round(t.rub), perDay]);
    gKg+=parseFloat(t.kg); gRub+=t.rub; gDays+=t.days;
  });
  dashRows.push([null,'ИТОГО ЗА ГОД',gDays,null,null,fmt(gKg),null,null,Math.round(gRub),gDays>0?Math.round(gRub/gDays):0]);
  dashRows.push([]);
  if(p.pricingType==='abonement'){
    dashRows.push([null,'УСЛОВИЯ: Абонемент',p.abonementFee,'₽/мес до',p.capKg,'кг. Сверх:',p.tariff,'₽/кг']);
  } else {
    dashRows.push([null,'УСЛОВИЯ: Тариф',p.tariff,'₽/кг']);
  }
  const wsDash = XLSX.utils.aoa_to_sheet(dashRows);
  wsDash['!cols']=[{wch:2},{wch:16},{wch:6},{wch:12},{wch:12},{wch:10},{wch:12},{wch:12},{wch:12},{wch:12}];
  XLSX.utils.book_append_sheet(wb, wsDash, '🎯 Дашборд');

  return wb;
}

function exportPointExcel(pid){
  const p = state.points.find(x=>x.id===pid);
  showToast('Формирую годовой Excel...');
  setTimeout(()=>{
    const wb = buildPointSheetData(p);
    if(!wb){ showToast('Нет данных для экспорта'); return; }
    // Move Сводка to front
    const sIdx = wb.SheetNames.indexOf('Сводка');
    if(sIdx>0){ wb.SheetNames.splice(sIdx,1); wb.SheetNames.unshift('Сводка'); }
    const yr = new Date().getFullYear();
    const fname = `${p.name.replace(/\s+/g,'_')}_Учет_Годовой_${yr}.xlsx`;
    XLSX.writeFile(wb, fname);
    showToast('Готово: ' + fname);
  }, 50);
}

function exportAllExcel(){
  showToast('Формирую сводный Excel...');
  setTimeout(()=>{
    const wb = XLSX.utils.book_new();
    const mk = thisMonthKey();
    const [yr, mo] = mk.split('-');
    const moName = MONTH_NAMES_RU[parseInt(mo)-1];

    // Summary sheet
    const summaryRows = [
      [null, `СВОДНЫЙ ОТЧЁТ — ${moName} ${yr}`],
      [],
      [null,'Точка','Адрес','Кг (стирка)','Кг (перест.)','Кг итого','Сумма стирка','Сумма перест.','Итого, ₽'],
    ];
    let gKg=0, gRub=0;
    state.points.forEach(p=>{
      const t = pointMonthTotals(p.id, mk);
      summaryRows.push([null, p.name, p.address||'', t.kgMain, t.kgRestirka, t.kg, Math.round(t.rubMain), Math.round(t.rubRestirka), Math.round(t.rub)]);
      gKg += t.kg; gRub += t.rub;
    });
    summaryRows.push([null,'ИТОГО','',null,null,fmt(gKg),null,null,Math.round(gRub)]);
    summaryRows.push([]);

    // Expenses
    const monthExp = state.expenses.filter(e=>monthKey(e.date)===mk);
    if(monthExp.length){
      summaryRows.push([null,'РАСХОДЫ ПРАЧЕЧНОЙ']);
      summaryRows.push([null,'Дата','Категория','Сумма, ₽','Заметка']);
      monthExp.sort((a,b)=>a.date.localeCompare(b.date)).forEach(e=>summaryRows.push([null,e.date,e.category,e.amount,e.note||'']));
      summaryRows.push([null,'ИТОГО расходы','',monthExp.reduce((s,e)=>s+e.amount,0)]);
    }

    const wsSummary = XLSX.utils.aoa_to_sheet(summaryRows);
    wsSummary['!cols']=[{wch:2},{wch:16},{wch:20},{wch:12},{wch:12},{wch:10},{wch:14},{wch:14},{wch:14}];
    XLSX.utils.book_append_sheet(wb, wsSummary, 'Сводка');

    // One month-sheet per point
    state.points.forEach(p=>{
      const ptWb = buildPointSheetData(p);
      if(!ptWb) return;
      ptWb.SheetNames.filter(s=>s!=='Сводка').forEach(sn=>{
        const label = (p.name.slice(0,10)+' '+sn).slice(0,31);
        XLSX.utils.book_append_sheet(wb, ptWb.Sheets[sn], label);
      });
    });

    const fname = `Прачечная_${mk}.xlsx`;
    XLSX.writeFile(wb, fname);
    showToast('Готово: ' + fname);
  }, 50);
}
