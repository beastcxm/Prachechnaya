<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Прачечная · Трекер</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#11151a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Прачечная">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#0c0f14;--surface:#13181f;--surface-2:#1a2130;--surface-3:#1f2837;
    --border:rgba(255,255,255,0.06);--border-mid:rgba(255,255,255,0.09);
    --text:#e8edf3;--text-dim:#7d8fa3;--text-faint:#3d4f62;
    --steam:#5fb8c9;--steam-2:#3d9aad;--steam-dim:rgba(95,184,201,0.12);--steam-glow:rgba(95,184,201,0.25);
    --amber:#f0a83c;--amber-dim:rgba(240,168,60,0.12);--red:#e05c57;--green:#5cb87a;
    --radius:16px;--radius-sm:10px;
    --shadow:0 2px 12px rgba(0,0,0,0.5);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:90px;background-image:radial-gradient(circle,rgba(255,255,255,0.035) 1px,transparent 1px);background-size:24px 24px;}

  /* ── Quick entry FAB ── */
  .fab{position:fixed;bottom:96px;right:18px;z-index:25;width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--steam),var(--steam-2));box-shadow:0 4px 20px var(--steam-glow),0 2px 8px rgba(0,0,0,0.5);border:none;cursor:pointer;font-size:24px;color:#071a1f;display:flex;align-items:center;justify-content:center;font-weight:300;transition:transform .15s,box-shadow .15s;}
  .fab:active{transform:scale(.93);box-shadow:0 2px 10px var(--steam-glow);}

  /* ── Quick entry modal ── */
  #quickModal{display:none;position:fixed;inset:0;z-index:100;background:rgba(8,11,16,0.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);align-items:flex-end;justify-content:center;}
  #quickModal.open{display:flex;}
  #quickSheet{width:100%;max-width:520px;background:var(--surface-2);border-radius:24px 24px 0 0;border-top:1px solid var(--border-mid);padding:20px 20px calc(20px + env(safe-area-inset-bottom));max-height:90vh;overflow-y:auto;animation:slideUp .25s cubic-bezier(.32,1,.23,1);}
  @keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
  #quickSheet .sheet-handle{width:36px;height:4px;background:var(--border-mid);border-radius:2px;margin:0 auto 18px;}
  #quickSheet h3{font-size:17px;font-weight:700;margin:0 0 18px;letter-spacing:-.01em;}

  /* ── Payment badge ── */
  .paid-badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;letter-spacing:.03em;}
  .paid-badge.paid{background:rgba(92,184,122,0.15);color:#5cb87a;}
  .paid-badge.unpaid{background:rgba(224,92,87,0.12);color:#e05c57;}

  /* ── Payment toggle in detail ── */
  .pay-toggle{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border);}
  .pay-toggle .pay-label{font-size:13.5px;color:var(--text-dim);}
  .pay-btn{border:1px solid var(--border-mid);background:transparent;color:var(--text-dim);border-radius:20px;padding:5px 14px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s;}
  .pay-btn.paid{border-color:rgba(92,184,122,0.4);color:#5cb87a;background:rgba(92,184,122,0.1);}

  .topbar{position:sticky;top:0;z-index:20;background:rgba(12,15,20,0.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:14px 18px 12px;display:flex;align-items:center;justify-content:space-between;}
  .topbar-left .mark{font-size:10px;letter-spacing:.18em;color:var(--steam);font-weight:700;text-transform:uppercase;opacity:.8;}
  .topbar-left h1{font-size:20px;margin:2px 0 0;font-weight:700;letter-spacing:-.02em;}
  .topbar-right{display:flex;align-items:center;gap:10px;}
  .sub{font-size:11px;color:var(--text-faint);}
  .view{padding:16px;max-width:520px;margin:0 auto;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .stat{background:linear-gradient(145deg,var(--surface-2),var(--surface));border:1px solid var(--border);border-radius:var(--radius);padding:16px;position:relative;overflow:hidden;}
  .stat::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.08),transparent);}
  .stat .label{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--text-faint);margin-bottom:8px;font-weight:600;}
  .stat .val{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.02em;}
  .stat .val.steam{color:var(--steam);}.stat .val.amber{color:var(--amber);}
  .stat .sub2{font-size:10.5px;color:var(--text-faint);margin-top:6px;}
  .stat-accent{position:absolute;bottom:0;left:0;right:0;height:2px;}
  .stat-accent.steam{background:linear-gradient(90deg,transparent,var(--steam),transparent);}
  .stat-accent.amber{background:linear-gradient(90deg,transparent,var(--amber),transparent);}
  .section-title{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--text-faint);margin:24px 2px 10px;display:flex;justify-content:space-between;align-items:center;font-weight:700;}
  .section-title .more{color:var(--steam);text-transform:none;letter-spacing:0;font-size:12px;cursor:pointer;font-weight:600;}
  .point-card{background:linear-gradient(135deg,var(--surface-2) 0%,var(--surface) 100%);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:8px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:border-color .15s,transform .1s;position:relative;overflow:hidden;}
  .point-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.07),transparent);}
  .point-card:active{transform:scale(0.99);border-color:var(--border-mid);}
  .point-accent{width:3px;height:36px;border-radius:2px;flex-shrink:0;}
  .point-card .pname{font-size:15px;font-weight:700;flex:1;min-width:0;letter-spacing:-.01em;}
  .point-card .pmeta{font-size:11.5px;color:var(--text-dim);margin-top:3px;}
  .point-card .pmoney{text-align:right;}
  .point-card .pmoney .amt{font-size:16px;font-weight:800;color:var(--amber);font-variant-numeric:tabular-nums;letter-spacing:-.01em;}
  .point-card .pmoney .amt-sub{font-size:10.5px;color:var(--text-faint);margin-top:2px;}
  .chev{color:var(--text-faint);font-size:16px;opacity:.5;}
  .btn{border:1px solid var(--border-mid);background:var(--surface-2);color:var(--text);border-radius:var(--radius-sm);padding:11px 16px;font-size:14px;font-weight:600;cursor:pointer;text-align:center;transition:opacity .15s,transform .1s;font-family:inherit;}
  .btn:active{transform:scale(.98);opacity:.85;}
  .btn-primary{background:linear-gradient(135deg,var(--steam) 0%,var(--steam-2) 100%);color:#071a1f;border:none;box-shadow:0 2px 12px var(--steam-glow);}
  .btn-block{width:100%;display:block;}.btn-sm{padding:7px 12px;font-size:12.5px;border-radius:8px;}
  label.f{display:block;margin-bottom:12px;}
  label.f .flabel{font-size:11px;color:var(--text-faint);margin-bottom:5px;display:block;font-weight:600;text-transform:uppercase;letter-spacing:.06em;}
  input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--border-mid);color:var(--text);border-radius:var(--radius-sm);padding:11px 13px;font-size:15px;font-family:inherit;transition:border-color .2s,box-shadow .2s;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--steam);box-shadow:0 0 0 3px var(--steam-dim);}
  select option{background:var(--surface-2);}
  .back-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .back-btn{font-size:13px;color:var(--steam);cursor:pointer;font-weight:600;}
  .entry-row{display:flex;align-items:center;padding:11px 0;border-bottom:1px solid var(--border);font-size:13.5px;gap:8px;}
  .entry-row:last-child{border-bottom:none;}
  .entry-row .ed{color:var(--text-faint);width:50px;flex-shrink:0;font-size:12px;font-weight:600;}
  .entry-row .ek{color:var(--text);flex:1;min-width:0;}
  .entry-row .eitems{font-size:11px;color:var(--text-faint);margin-top:3px;line-height:1.4;}
  .entry-row .ep{color:var(--amber);font-weight:700;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;}
  .entry-row .edel{color:var(--text-faint);margin-left:6px;cursor:pointer;font-size:15px;opacity:.5;}
  .card{background:linear-gradient(145deg,var(--surface-2),var(--surface));border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px;position:relative;overflow:hidden;}
  .card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.07),transparent);}
  .tabbar{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(12,15,20,0.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;padding:8px 8px calc(8px + env(safe-area-inset-bottom));gap:2px;}
  .tab{flex:1;text-align:center;padding:6px 2px;cursor:pointer;color:var(--text-faint);font-size:9.5px;font-weight:600;border-radius:10px;transition:color .15s;}
  .tab .ic{font-size:18px;display:block;margin-bottom:3px;}
  .tab.active{color:var(--steam);background:var(--steam-dim);}
  .empty{text-align:center;padding:40px 10px;color:var(--text-faint);font-size:13.5px;}
  .empty .ic{font-size:30px;display:block;margin-bottom:10px;opacity:.4;}
  .toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%) translateY(8px);background:var(--surface-3);border:1px solid var(--border-mid);color:var(--text);padding:9px 18px;border-radius:24px;font-size:13px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;box-shadow:var(--shadow);}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .item-grid{display:grid;grid-template-columns:1fr 64px;gap:8px;align-items:center;margin-bottom:7px;}
  .item-grid .iname{font-size:13px;color:var(--text-dim);}
  .seg{display:flex;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;margin-bottom:14px;padding:3px;gap:3px;}
  .seg div{flex:1;text-align:center;padding:8px 4px;font-size:12.5px;font-weight:600;color:var(--text-faint);cursor:pointer;border-radius:8px;transition:all .15s;}
  .seg div.active{background:var(--steam-dim);color:var(--steam);}
  .addrow{display:flex;gap:8px;margin-top:4px;}.addrow input{flex:1;}
  .hint{font-size:11.5px;color:var(--text-faint);line-height:1.6;margin-bottom:10px;}
  #authOverlay{display:none;position:fixed;inset:0;background:radial-gradient(ellipse at 50% 30%,#0f1a24 0%,var(--bg) 65%);z-index:200;flex-direction:column;align-items:center;justify-content:center;padding:28px;}
  #authOverlay .auth-box{width:100%;max-width:320px;}
  #authOverlay .auth-logo{text-align:center;margin-bottom:20px;}
  #authOverlay .auth-logo img{width:72px;height:72px;border-radius:18px;box-shadow:0 8px 32px rgba(95,184,201,0.2);}
  #authOverlay .auth-title{font-size:22px;font-weight:800;text-align:center;margin-bottom:4px;letter-spacing:-.02em;}
  #authOverlay .auth-sub{font-size:13px;color:var(--text-dim);text-align:center;margin-bottom:28px;line-height:1.5;}
  #authError{color:var(--red);font-size:12.5px;min-height:18px;margin-bottom:10px;text-align:center;font-weight:500;}
  .view-only-btn{margin-top:18px;text-align:center;font-size:13px;color:var(--text-faint);cursor:pointer;padding:8px;}
  #adminBadge{font-size:10px;color:var(--steam);font-weight:700;background:var(--steam-dim);border:1px solid rgba(95,184,201,0.2);padding:3px 9px;border-radius:20px;letter-spacing:.04em;}
  #loginBtn,#logoutBtn{font-size:12px;color:var(--text-faint);cursor:pointer;padding:4px 8px;border-radius:8px;}
  #loadingScreen{position:fixed;inset:0;background:var(--bg);z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;}
  #loadingScreen .spin{width:36px;height:36px;border:2px solid var(--surface-3);border-top-color:var(--steam);border-radius:50%;animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  #loadingScreen .load-txt{font-size:13px;color:var(--text-faint);font-weight:500;}
</style>
</head>
<body>

<!-- Loading screen -->
<div id="loadingScreen">
  <div class="spin"></div>
  <div class="load-txt">Загрузка данных...</div>
</div>

<!-- Auth overlay -->
<div id="authOverlay">
  <div class="auth-box">
    <div class="auth-logo"><img src="icon-192.png" style="width:72px;height:72px;border-radius:16px;"></div>
    <div class="auth-title">Прачечная</div>
    <div class="auth-sub">Войди как администратор или просматривай без входа</div>
    <label class="f"><span class="flabel">Email</span><input type="email" id="authEmail" placeholder="admin@example.com" autocomplete="email"></label>
    <label class="f"><span class="flabel">Пароль</span><input type="password" id="authPassword" placeholder="••••••••" autocomplete="current-password"></label>
    <div id="authError"></div>
    <button class="btn btn-primary btn-block" id="authLoginBtn">Войти как администратор</button>
    <div class="view-only-btn" id="authViewOnlyBtn">Продолжить без входа →</div>
  </div>
</div>

<!-- Main app -->
<div class="topbar">
  <div class="topbar-left">
    <div class="mark">Учёт стирки</div>
    <h1 id="topTitle">Дашборд</h1>
  </div>
  <div class="topbar-right">
    <div class="sub" id="todayDate"></div>
    <div id="adminBadge" style="display:none;font-size:11px;color:var(--steam);font-weight:700;border:1px solid var(--steam-dim);padding:3px 8px;border-radius:20px;">Админ</div>
    <div id="loginBtn" style="display:none;font-size:12px;color:var(--text-faint);cursor:pointer;">🔒 Войти</div>
    <div id="logoutBtn" style="display:none;font-size:12px;color:var(--text-faint);cursor:pointer;">Выйти</div>
  </div>
</div>

<div class="view" id="view"></div>
<div class="toast" id="toast"></div>

<!-- FAB quick entry -->
<button class="fab" id="fabBtn" style="display:none;">+</button>

<!-- Quick entry modal -->
<div id="quickModal">
  <div id="quickSheet">
    <div class="sheet-handle"></div>
    <h3>Быстрая запись</h3>
    <label class="f"><span class="flabel">Точка</span>
      <select id="qPoint"></select>
    </label>
    <label class="f"><span class="flabel">Дата</span><input type="date" id="qDate"></label>
    <label class="f"><span class="flabel">Вес, кг</span><input type="number" id="qKg" placeholder="0" step="0.1"></label>
    <label class="f"><span class="flabel">Заметка</span><input type="text" id="qNote" placeholder="срочно, доставка..."></label>
    <div style="display:flex;gap:10px;margin-top:4px;">
      <button class="btn btn-block" id="qCancelBtn">Отмена</button>
      <button class="btn btn-primary btn-block" id="qSaveBtn">Сохранить</button>
    </div>
  </div>
</div>

<div class="tabbar">
  <div class="tab active" data-tab="dashboard"><span class="ic">◉</span>Дашборд</div>
  <div class="tab" data-tab="points"><span class="ic">◼</span>Точки</div>
  <div class="tab" data-tab="restirka"><span class="ic">♻</span>Перестирка</div>
  <div class="tab" data-tab="expenses"><span class="ic">₽</span>Расходы</div>
  <div class="tab" data-tab="driver"><span class="ic">►</span>Водитель</div>
  <div class="tab" id="settingsTab" data-tab="settings"><span class="ic">⚙</span>Настройки</div>
</div>

<script type="module">

// ─── Constants ───────────────────────────────────────────────────
const DOT_COLORS = ['#5fb8c9','#e3a64f','#d9645f','#6fbf78','#8a7fd6','#d68fc0','#7ea6d9','#c9a45f'];

const DEFAULT_POINTS = [
  {id:'saray',   name:'Сарай 1',      address:'', pricingType:'abonement', tariff:100, abonementFee:85000, capKg:800, items:mkItems(['Ошибори','Салфетка','Микрофибра','Фартук','Сидушка','Чехол на кресло','Брюки','Куртка повара','Плед','Скатерть','Шторы','Коврик'],PRICES_REST)},

  {id:'padel',   name:'Падел',        address:'', pricingType:'perkg',     tariff:80,  abonementFee:0,     capKg:0,   items:mkItems(['Полотенце'])},

];
const DEFAULT_SETTINGS = {

// ─── Helpers ─────────────────────────────────────────────────────
function fmt(n){ return Math.round((n||0)*100)/100; }
function rub(n){ return Math.round(n||0).toLocaleString('ru-RU')+' ₽'; }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function monthKey(d){ return d.slice(0,7); }
function thisMonth(){ return todayStr().slice(0,7); }
function fmtDate(d){ const [y,m,day]=d.split('-'); return day+'.'+m; }
function daysInMonth(yr,mo){ return new Date(yr,mo,0).getDate(); }
function dayOfWeek(dateStr){ return DAY_NAMES[new Date(dateStr).getDay()]; }

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');

}

// ─── Firebase Data Layer ──────────────────────────────────────────
async function loadAllData(){
  // Points config
  const pdoc = await getDoc(doc(db,'config','points'));
  if(pdoc.exists()){ state.points = pdoc.data().list || []; }
  else { state.points = structuredClone(DEFAULT_POINTS); await setDoc(doc(db,'config','points'),{list:state.points}); }
  state.points.forEach(p=>{ if(!p.address) p.address=''; p.items.forEach(it=>{ if(!it.pricePerUnit) it.pricePerUnit=0; }); });

  // Settings
  const sdoc = await getDoc(doc(db,'config','settings'));
  if(sdoc.exists()){
    const s=sdoc.data();
    state.restirkaItems = s.restirkaItems || DEFAULT_SETTINGS.restirkaItems;
    state.restirkaTariff = s.restirkaTariff || 100;
    state.expenseCategories = s.expenseCategories || DEFAULT_SETTINGS.expenseCategories;
  } else { await setDoc(doc(db,'config','settings'),DEFAULT_SETTINGS); }

  // Entries
  state.entries={};
  (await getDocs(collection(db,'entries'))).forEach(d=>{
    const e={...d.data(),id:d.id};
    if(!state.entries[e.pointId]) state.entries[e.pointId]=[];
    state.entries[e.pointId].push(e);
  });

  // Restirka
  state.restirka={};
  (await getDocs(collection(db,'restirka'))).forEach(d=>{
    const r={...d.data(),id:d.id};
    if(!state.restirka[r.pointId]) state.restirka[r.pointId]=[];
    state.restirka[r.pointId].push(r);
  });

  // Expenses
  state.expenses=[];
  (await getDocs(collection(db,'expenses'))).forEach(d=>state.expenses.push({...d.data(),id:d.id}));

  // Driver
  state.driverNotes=[];
  (await getDocs(collection(db,'driverNotes'))).forEach(d=>state.driverNotes.push({...d.data(),id:d.id}));

  // Payments
  const paydoc = await getDoc(doc(db,'config','payments'));
  state.payments = paydoc.exists() ? (paydoc.data().map||{}) : {};
}

async function savePoints(){ await setDoc(doc(db,'config','points'),{list:state.points}); }
async function saveSettings(){ await setDoc(doc(db,'config','settings'),{restirkaItems:state.restirkaItems,restirkaTariff:state.restirkaTariff,expenseCategories:state.expenseCategories}); }
async function savePayments(){ await setDoc(doc(db,'config','payments'),{map:state.payments}); }
function payKey(pointId, mk){ return pointId+'_'+mk; }
function isPaid(pointId, mk){ return !!state.payments[payKey(pointId,mk)]; }
async function togglePaid(pointId, mk){
  const k=payKey(pointId,mk);
  state.payments[k]=!state.payments[k];
  await savePayments();
}

async function addEntry(pointId, data){
  const ref=await addDoc(collection(db,'entries'),{...data,pointId});
  const e={...data,pointId,id:ref.id};
  if(!state.entries[pointId]) state.entries[pointId]=[];
  state.entries[pointId].push(e);
  return e;
}
async function delEntry(id, pointId){
  await deleteDoc(doc(db,'entries',id));
  state.entries[pointId]=(state.entries[pointId]||[]).filter(e=>e.id!==id);
}

async function addRestirka(pointId, data){
  const ref=await addDoc(collection(db,'restirka'),{...data,pointId});
  const r={...data,pointId,id:ref.id};
  if(!state.restirka[pointId]) state.restirka[pointId]=[];
  state.restirka[pointId].push(r);
}
async function delRestirka(id, pointId){
  await deleteDoc(doc(db,'restirka',id));
  state.restirka[pointId]=(state.restirka[pointId]||[]).filter(r=>r.id!==id);
}

async function addExpense(data){
  const ref=await addDoc(collection(db,'expenses'),data);
  state.expenses.push({...data,id:ref.id});
}
async function delExpense(id){ await deleteDoc(doc(db,'expenses',id)); state.expenses=state.expenses.filter(e=>e.id!==id); }

async function addDriver(data){
  const ref=await addDoc(collection(db,'driverNotes'),data);
  state.driverNotes.push({...data,id:ref.id});
}
async function delDriver(id){ await deleteDoc(doc(db,'driverNotes',id)); state.driverNotes=state.driverNotes.filter(d=>d.id!==id); }

// ─── Totals ───────────────────────────────────────────────────────
function pointEntries(id){ return state.entries[id]||[]; }
function pointRestirka(id){ return state.restirka[id]||[]; }
function pointMonthTotals(id, mk){
  const p=state.points.find(x=>x.id===id);
  const es=pointEntries(id).filter(e=>monthKey(e.date)===mk);
  const rs=pointRestirka(id).filter(r=>monthKey(r.date)===mk);
  const kgMain=fmt(es.reduce((s,e)=>s+(e.kg||0),0));
  const kgRest=fmt(rs.reduce((s,r)=>s+(r.kg||0),0));
  const rubRest=rs.reduce((s,r)=>s+(r.rub||0),0);
  let rubMain=0, subLabel='';
  if(p.pricingType==='abonement'){
    const over=Math.max(0,kgMain-p.capKg);
    rubMain=p.abonementFee+over*p.tariff;
    subLabel=over>0?`+${fmt(over)} кг сверх`:`до ${p.capKg} кг`;
  } else { rubMain=Math.round(kgMain*p.tariff); subLabel=p.tariff+'₽/кг'; }
  return {kg:fmt(kgMain+kgRest),kgMain,kgRest,rub:rubMain+rubRest,rubMain,rubRest,days:es.length,subLabel};
}

// ── Dashboard ──

  const unpaidCount=state.points.filter(p=>pointMonthTotals(p.id,mk).rub>0&&!isPaid(p.id,mk)).length;

  el.innerHTML=`
    <div class="grid2">

// ─── Excel Export ─────────────────────────────────────────────────
function buildYearlyWb(p, year){
  if(typeof XLSX==='undefined'){ showToast('Нет соединения для экспорта'); return null; }
  const wb=XLSX.utils.book_new(); const yr=year||new Date().getFullYear();
  const summary=[];
  for(let mo=1;mo<=12;mo++){
    const mk=`${yr}-${String(mo).padStart(2,'0')}`;
    const moName=MONTH_NAMES[mo-1]; const numDays=daysInMonth(yr,mo);
    const mE=pointEntries(p.id).filter(e=>monthKey(e.date)===mk);
    const mR=pointRestirka(p.id).filter(r=>monthKey(r.date)===mk);
    const byDay={};
    for(let d=1;d<=numDays;d++) byDay[d]={kg:0,items:{},restKg:0,restRub:0,note:'',_sh:0};
    mE.forEach(e=>{ const d=parseInt(e.date.split('-')[2]); byDay[d].kg+=e.kg||0; if(e.note) byDay[d].note=e.note; Object.entries(e.items||{}).forEach(([iid,n])=>{ byDay[d].items[iid]=(byDay[d].items[iid]||0)+n; }); });
    mR.forEach(r=>{ const d=parseInt(r.date.split('-')[2]); byDay[d].restKg+=r.kg||0; byDay[d].restRub+=r.rub||0; });
    let tKg=0,tEd=0,tSh=0,tDays=0,tRest=0,tRestRub=0; const iT={};
    p.items.forEach(it=>iT[it.id]=0);
    for(let d=1;d<=numDays;d++){
      const row=byDay[d]; if(row.kg>0||Object.keys(row.items).length) tDays++;
      tKg+=row.kg; tRest+=row.restKg; tRestRub+=row.restRub;
      let sh=0; p.items.forEach(it=>{ const n=row.items[it.id]||0; iT[it.id]+=n; tEd+=n; if(it.pricePerUnit>0) sh+=n*it.pricePerUnit; }); tSh+=sh; row._sh=sh;
    }
    let tMainRub=p.pricingType==='abonement'?p.abonementFee+Math.max(0,tKg-p.capKg)*p.tariff:Math.round(tKg*p.tariff);
    const tRub=tMainRub+tSh+tRestRub;
    summary.push({mo,moName,tDays,tKg:fmt(tKg),tRest:fmt(tRest),tEd,tMainRub,tSh,tRestRub,tRub});
    const rows=[];
    rows.push([null,`${p.name.toUpperCase()} · ${moName.toUpperCase()} ${yr}`]);
    rows.push([null,`${p.name} · Учёт стирки за ${moName.toLowerCase()} ${yr}`]);
    rows.push([]);
    rows.push([null,'ВЕС, КГ',null,null,null,null,'ЕДИНИЦ',null,null,null,null,'ДНЕЙ',null,null,null,null,'К ОПЛАТЕ, ₽']);
    rows.push([null,fmt(tKg+tRest),null,null,null,null,tEd,null,null,null,null,tDays,null,null,null,null,tRub]);
    rows.push([]);
    rows.push([null,p.pricingType==='abonement'?`Абонемент ${p.abonementFee.toLocaleString('ru-RU')} ₽/мес (до ${p.capKg} кг), сверх: ${p.tariff} ₽/кг`:`Тариф: ${p.tariff} ₽/кг`]);
    rows.push([]);
    rows.push([null,'День','ДН','Вес, кг','Всего ед.',...p.items.map(it=>it.name),'Перест.,кг','Заметки','Стирка,₽','Штучные,₽','К оплате,₽']);
    for(let d=1;d<=numDays;d++){
      const row=byDay[d]; const ds=`${yr}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const ed=p.items.reduce((s,it)=>s+(row.items[it.id]||0),0);
      const mr=p.pricingType==='perkg'&&row.kg>0?Math.round(row.kg*p.tariff):null;
      const tot=(mr||0)+(row._sh||0)+row.restRub||null;
      rows.push([null,d,dayOfWeek(ds),row.kg||null,ed||null,...p.items.map(it=>row.items[it.id]||null),row.restKg||null,row.note||null,mr,row._sh||null,tot]);
    }
    const iTC=p.items.map(it=>iT[it.id]||null);
    rows.push([null,'ИТОГО',null,fmt(tKg)||null,tEd||null,...iTC,fmt(tRest)||null,null,tMainRub||null,tSh||null,tRub||null]);
    if(mR.length){
      rows.push([],[ null,`ПЕРЕСТИРКА (${state.restirkaTariff} ₽/кг)`]);
      rows.push([null,'Дата','кг',...state.restirkaItems.map(it=>it.name),'Сумма,₽']);
      mR.sort((a,b)=>a.date.localeCompare(b.date)).forEach(r=>rows.push([null,r.date,r.kg,...state.restirkaItems.map(it=>(r.qty&&r.qty[it.id])||null),r.rub]));
      rows.push([null,'Итого',fmt(tRest),...state.restirkaItems.map(()=>null),Math.round(tRestRub)]);
    }
    const ws=XLSX.utils.aoa_to_sheet(rows);
    ws['!cols']=[{wch:2},{wch:6},{wch:4},{wch:8},{wch:8},...p.items.map(()=>({wch:10})),{wch:10},{wch:20},{wch:10},{wch:10},{wch:12}];
    XLSX.utils.book_append_sheet(wb,ws,`${String(mo).padStart(2,'0')}.${moName.slice(0,3)}`);
  }
  // Summary sheet
  const srows=[[null,`${p.name} · ГОДОВОЙ ОТЧЁТ ${yr}`],[],[null,'Месяц','Дней','Кг','Перест.кг','Всего кг','Ед.','Стирка,₽','Штуч,₽','Перест,₽','Итого,₽']];
  let gKg=0,gRub=0;
  summary.forEach(s=>{ const tot=fmt((parseFloat(s.tKg)||0)+(parseFloat(s.tRest)||0)); srows.push([null,s.moName,s.tDays||null,s.tKg||null,s.tRest||null,tot||null,s.tEd||null,s.tMainRub||null,s.tSh||null,s.tRestRub||null,s.tRub||null]); gKg+=parseFloat(tot)||0; gRub+=s.tRub||0; });
  srows.push([null,'ИТОГО',null,null,null,fmt(gKg),null,null,null,null,Math.round(gRub)]);
  const ws2=XLSX.utils.aoa_to_sheet(srows); ws2['!cols']=[{wch:2},{wch:14},{wch:6},{wch:10},{wch:10},{wch:10},{wch:6},{wch:12},{wch:10},{wch:10},{wch:12}];
  XLSX.utils.book_append_sheet(wb,ws2,'📊 Годовая сводка');
  return wb;
}

function exportAllExcel(){
  if(typeof XLSX==='undefined'){ showToast('Нет соединения'); return; }
  showToast('Формирую...');
  setTimeout(()=>{
    const wb=XLSX.utils.book_new(); const yr=new Date().getFullYear(); const mk=thisMonth();
    const sr=[[null,`СВОДКА · ${yr}`],[],[null,'Точка','Адрес','Кг','Перест.кг','Итого кг','К оплате,₽']];
    let gK=0,gR=0;
    state.points.forEach(p=>{ const t=pointMonthTotals(p.id,mk); sr.push([null,p.name,p.address||'',t.kgMain,t.kgRest,t.kg,Math.round(t.rub)]); gK+=parseFloat(t.kg)||0; gR+=t.rub||0; });
    sr.push([null,'ИТОГО','','','',fmt(gK),Math.round(gR)]);
    const ws=XLSX.utils.aoa_to_sheet(sr); ws['!cols']=[{wch:2},{wch:16},{wch:20},{wch:10},{wch:10},{wch:10},{wch:14}];
    XLSX.utils.book_append_sheet(wb,ws,'Сводка');
    state.points.forEach(p=>{ const ptWb=buildYearlyWb(p,yr); if(!ptWb) return; ptWb.SheetNames.forEach(sn=>{ const label=(p.name.slice(0,8)+' '+sn).slice(0,31); XLSX.utils.book_append_sheet(wb,ptWb.Sheets[sn],label); }); });
    XLSX.writeFile(wb,`Прачечная_${yr}.xlsx`); showToast('Готово!');
  },50);
}

// ─── Auth listener & init ──────────────────────────────────────────
onAuthStateChanged(auth, async(user)=>{
  isAdmin = !!user;
  updateTopbar();
  render();
});

// Init
(async()=>{
  showLoading();
  try{
    await loadAllData();
  } catch(e){
    console.error(e);
    showToast('Ошибка загрузки данных');
  }
  hideLoading();
  // Check if logged in already handled by onAuthStateChanged
  // If no auth state yet, show auth overlay after brief delay
  setTimeout(()=>{
    if(!auth.currentUser && document.getElementById('view').innerHTML===''){
      showAuthOverlay();
    }
  }, 1500);
})();

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('service-worker.js').catch(()=>{}));
}
</script>
</body>
</html>
